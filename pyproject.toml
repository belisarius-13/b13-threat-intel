[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "b13-threat-intel"
version = "0.1.0"
description = "Automated defensive threat intelligence pipeline for collection, enrichment, prioritization and publication."
readme = "README.md"
requires-python = ">=3.13"

authors = [
    { name = "Joseph Daniel" }
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
